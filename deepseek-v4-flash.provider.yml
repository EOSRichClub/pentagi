# DeepSeek V4 Flash — all agent roles use deepseek-v4-flash
# Thinking disabled on utility agents for speed/cost; enabled on core pentest roles.

simple:
  model: deepseek-v4-flash
  temperature: 0.3
  top_p: 0.9
  n: 1
  max_tokens: 8192
  extra_body:
    thinking:
      type: disabled
  price:
    input: 0.14
    output: 0.28
    cache_read: 0.0028

