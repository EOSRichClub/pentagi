# DeepSeek V4 Flash -- all agent roles use deepseek-v4-flash
# Max thinking profile: thinking enabled for every role, reasoning effort set to high.

simple:
  model: deepseek-v4-flash
  temperature: 0.3
  top_p: 0.9
  n: 1
  max_tokens: 8192
  reasoning:
    effort: high
  extra_body:
    thinking:
      type: enabled
  price:
    input: 0.14
    output: 0.28
    cache_read: 0.0028

